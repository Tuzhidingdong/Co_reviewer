[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co-reviewer"
version = "0.2.0"
description = "A safe, traceable multi-document academic manuscript revision toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5.0.0"]

[project.scripts]
co-reviewer = "co_reviewer_cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["co_reviewer_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
