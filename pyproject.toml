[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co-reviewer"
version = "0.3.0"
description = "A safe, traceable multi-document academic manuscript revision toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5.0.0", "python-docx>=1.1.2"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24.0,<2.0"]

[project.scripts]
co-reviewer = "co_reviewer_cli:main"
co-reviewer-evidence = "evidence_tools:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["co_reviewer_cli", "response_letter_docx", "evidence_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
