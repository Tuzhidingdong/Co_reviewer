name: Co_Reviewer tests

on:
  push:
    branches:
      - main
      - "upgrade/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: co-reviewer-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Check the declared minimum and the current user-relevant Python version.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse PowerShell quality-check script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/run_quality_checks.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Compile all Python modules and tests
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI help
        run: python scripts/co_reviewer_cli.py --help
      - name: Cached review audit CLI help
        run: python scripts/co_reviewer_cli.py audit --help
      - name: Pending decision-plan validator CLI help
        run: python scripts/validate_decision_plan.py --help
      - name: Source preflight CLI help
        run: python scripts/co_reviewer_cli.py preflight-plan --help
      - name: Verified-state confirmation CLI help
        run: python scripts/co_reviewer_cli.py confirm-verified --help
      - name: Usage audit CLI help
        run: python scripts/co_reviewer_cli.py audit-usage --help
      - name: Usage event CLI help
        run: python scripts/co_reviewer_cli.py record-usage-event --help
      - name: DOCX quality audit CLI help
        run: python scripts/co_reviewer_cli.py audit-docx-quality --help
