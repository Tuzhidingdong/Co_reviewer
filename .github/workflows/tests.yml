name: Co_Reviewer tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "upgrade/v0.5.1-p0-*"
  workflow_dispatch:

concurrency:
  group: co-reviewer-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-unit:
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile source and tests
        run: python -m compileall -q scripts tests
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

  test:
    runs-on: windows-latest
    env:
      PYTHONPATH: scripts
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Check the declared minimum and the current user-relevant Python version.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Parse PowerShell quality-check script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/run_quality_checks.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Run PowerShell 5.1 quality-check script
        shell: powershell
        run: |
          $python = (Get-Command python -CommandType Application).Source
          ./scripts/run_quality_checks.ps1 -PythonExe $python
