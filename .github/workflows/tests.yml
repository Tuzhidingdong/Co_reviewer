name: Co_Reviewer tests

on:
  push:
    branches:
      - main
      - "upgrade/v0.5.1-p1-*"
      - "fix/v232-*"
  pull_request:
    branches:
      - main
      - "upgrade/v0.5.1-p0-*"
      - "upgrade/v0.5.1-p1-*"
      - "fix/v232-*"
      - "docs/freeze-global-user-task-plan-v2.3.2-20261120"
  workflow_dispatch:

concurrency:
  group: co-reviewer-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-unit:
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile source and tests
        run: python -m compileall -q scripts tests
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

  test:
    runs-on: windows-latest
    env:
      PYTHONPATH: scripts
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Check the declared minimum and the current user-relevant Python version.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Parse all PowerShell entry points
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem -LiteralPath "scripts" -Filter "*.ps1" -File -Recurse
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error ("PowerShell parse failed: " + $scriptFile.FullName)
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Run PowerShell 5.1 quality-check script
        shell: powershell
        run: |
          $python = (& python -c "import sys; print(sys.executable)" | Select-Object -First 1)
          $python = ([string]$python).Trim()
          if ([string]::IsNullOrWhiteSpace($python) -or -not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Could not resolve the active setup-python interpreter path."
          }
          ./scripts/run_quality_checks.ps1 -PythonExe ([string]$python)
